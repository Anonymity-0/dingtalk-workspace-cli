<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12263f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill: #7dd3fc; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .title { fill: #f8fafc; font-size: 46px; font-weight: 750; }
      .sub { fill: #94a3b8; font-size: 22px; }
      .h { fill: #e2e8f0; font-size: 26px; font-weight: 700; }
      .body { fill: #cbd5e1; font-size: 22px; }
      .code { fill: #d1fae5; font-size: 21px; }
      .ok { fill: #34d399; font-size: 23px; font-weight: 750; }
      .muted { fill: #94a3b8; font-size: 19px; }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1440" cy="90" r="230" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="120" cy="1060" r="300" fill="#34d399" opacity="0.06"/>

  <text x="100" y="95" class="sans label">DWS · ACTUAL AGENT E2E EVIDENCE</text>
  <text x="100" y="155" class="sans title">Minutes upload → completion → read-back</text>
  <text x="100" y="198" class="sans sub">PR #946 · head f81d09fb · 2026-08-11 · sanitized report</text>

  <rect x="80" y="245" width="1440" height="185" rx="22" fill="#0b1728" stroke="#28435f" filter="url(#shadow)"/>
  <text x="120" y="295" class="sans h">Natural-language task handled by the Agent</text>
  <text x="120" y="342" class="sans body">“Upload a real local audio file as a Minutes record, verify that the service can read it back,</text>
  <text x="120" y="378" class="sans body">and never treat an empty result or an internal error as success.”</text>
  <text x="120" y="410" class="sans muted">Write execution used explicit user authorization; identifiers, signed URLs, credentials and content are omitted.</text>

  <rect x="80" y="465" width="1440" height="240" rx="22" fill="#071522" stroke="#24546a" filter="url(#shadow)"/>
  <text x="120" y="520" class="sans h">Agent-selected executable path</text>
  <text x="120" y="570" class="mono code">1  dws minutes +upload --file &lt;generated-1s-wav&gt; --yes</text>
  <text x="120" y="616" class="mono code">   create → pre-signed HTTPS PUT → complete → built-in basic read-back</text>
  <text x="120" y="662" class="mono code">2  dws minutes +detail --id &lt;non-empty-real-task-handle&gt; --artifacts basic</text>

  <rect x="80" y="740" width="690" height="265" rx="22" fill="#0b1728" stroke="#256a57" filter="url(#shadow)"/>
  <text x="120" y="795" class="sans h">Real service result</text>
  <text x="120" y="842" class="sans ok">PASS · upload and read-back completed</text>
  <text x="120" y="885" class="mono body">sizeBytes          32078</text>
  <text x="120" y="922" class="mono body">uploadAttempts     1</text>
  <text x="120" y="959" class="mono body">complete / verified true / true</text>
  <text x="120" y="988" class="mono muted">session + task handles: non-empty</text>

  <rect x="805" y="740" width="715" height="265" rx="22" fill="#0b1728" stroke="#365a7c" filter="url(#shadow)"/>
  <text x="845" y="795" class="sans h">Fail-closed assertions</text>
  <text x="845" y="842" class="sans body">✓ detail bundle complete=true</text>
  <text x="845" y="881" class="sans body">✓ failureCount=0 and basic is an object</text>
  <text x="845" y="920" class="sans body">✓ UUID/session fields checked non-empty</text>
  <text x="845" y="959" class="sans body">✓ command exit code checked before parsing</text>
  <text x="845" y="990" class="sans muted">No empty-array or empty-object success shortcut.</text>

  <text x="100" y="1070" class="sans muted">Supporting gates: localio 100% statement coverage · changed-code 100% (1605 statements) · make policy PASS · go test ./... PASS</text>
</svg>
